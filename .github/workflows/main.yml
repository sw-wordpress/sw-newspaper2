name: Build release zip

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine repository name and version
        id: metadata
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          RAW="${GITHUB_REF_NAME}"
          VERSION="${RAW#v}"
          VERSION="${VERSION%-*}"

          echo "repo=$REPO_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=${REPO_NAME}-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Bundle WordPress plugin
        env:
          REPO_NAME: ${{ steps.metadata.outputs.repo }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          STAGING="$RUNNER_TEMP/staging/$REPO_NAME"

          mkdir -p "$STAGING"

          # Copy repository without Git internals
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            ./ "$STAGING/"

          # Create ZIP with repository name as root folder
          (
            cd "$RUNNER_TEMP/staging"
            zip -qr "$GITHUB_WORKSPACE/${REPO_NAME}-${VERSION}.zip" "$REPO_NAME"
          )

      - name: Create release and attach ZIP
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.metadata.outputs.version }}
          files: ${{ steps.metadata.outputs.zip }}
